# ==============================================================================
# Directus AceLoans — Base (portable)
# ==============================================================================
#
# Portable base file. No host port bindings, no host-specific mounts, no
# host_gateway entries. Each deployment target supplies its own overlay:
#
#   Sentinel (staging):
#     docker compose -f docker-compose.yml -f docker-compose.sentinel.yml up -d
#
#   MBP-local dev (follow-up; overlay TBD):
#     docker compose -f docker-compose.yml -f docker-compose.mbp.yml up -d
#
# Pattern reference: kestra-kiron uses the same base + overlay split.
# ==============================================================================

services:

  directus:
    container_name: aceloans-directus
    image: directus/directus:11.15.1
    networks:
      - directus
    depends_on:
      directus-cache:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 and
      # stops there, while Directus listens on IPv4 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  directus-cache:
    container_name: aceloans-directus-cache
    image: redis:7-alpine
    networks:
      - directus
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  directus:
    name: aceloans-directus
